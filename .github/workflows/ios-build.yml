name: iOS build and tests

# Runs only when the app or this workflow changes. Pushes that touch documents alone
# used to spend a macOS build each time.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image. xcode-27 has Xcode 27.1 and the iOS 27 SDK; macos-26 is available for compatibility checks.
        type: choice
        options: [macos-26, xcode-27]
        default: xcode-27

permissions:
  contents: read

jobs:
  build-and-test:
    # A manual run can pick the runner, to check the app against a newer Xcode.
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: Show Xcode and available iPad simulators
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available --json | jq '
            .devices | to_entries[]
            | select(.key | contains("SimRuntime.iOS-"))
            | .key as $runtime
            | .value[]
            | select(.isAvailable == true and (.name | contains("iPad")))
            | {runtime: $runtime, name: .name, udid: .udid, state: .state}'

      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project ClipboardPlus.xcodeproj \
            -scheme ClipboardPlus \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Select an available iPad simulator
        id: simulator
        env:
          SIMULATOR_IOS_MAJOR: ${{ inputs.runner == 'macos-26' && '26' || '27' }}
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl list devices available --json | jq -r --arg runtime "SimRuntime.iOS-$SIMULATOR_IOS_MAJOR-" '
            [.devices | to_entries[]
            | select(.key | contains($runtime))
            | .value[]
            | select(.isAvailable == true and (.name | contains("iPad")))
            | .udid] | first // empty')
          if [ -z "$simulator_id" ]; then
            echo "No available iPad simulator for iOS $SIMULATOR_IOS_MAJOR was found."
            exit 1
          fi
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build without signing
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ClipboardPlus.xcodeproj \
            -scheme ClipboardPlus \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify embedded extensions (Simulator)
        working-directory: app
        run: |
          set -euo pipefail
          app_path="DerivedData/Build/Products/Debug-iphonesimulator/ClipboardPlus.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ClipboardPlusAppGroup' "$app_path/Info.plist")" = "group.example.clipboardplus"

          keyboard_path="$app_path/PlugIns/ClipboardPlusKeyboard.appex"
          test -d "$keyboard_path"
          test -f "$keyboard_path/ClipboardPlusKeyboard"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$keyboard_path/Info.plist")" = "com.apple.keyboard-service"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:RequestsOpenAccess' "$keyboard_path/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ClipboardPlusAppGroup' "$keyboard_path/Info.plist")" = "group.example.clipboardplus"
          test -d "$keyboard_path/AzooKeyKanaKanjiConverter_KanaKanjiConverterModuleWithDefaultDictionary.bundle/Dictionary"
          test -f "$keyboard_path/AzooKeyKanaKanjiConverter_KanaKanjiConverterModuleWithDefaultDictionary.bundle/Dictionary/louds/charID.chid"

          share_path="$app_path/PlugIns/ClipboardPlusShare.appex"
          test -d "$share_path"
          test -f "$share_path/ClipboardPlusShare"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$share_path/Info.plist")" = "com.apple.share-services"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ClipboardPlusAppGroup' "$share_path/Info.plist")" = "group.example.clipboardplus"

      # APIs can differ between the device SDK and the simulator SDK.
      # This catches that before a TestFlight upload does.
      - name: Build for a device without signing
        working-directory: app
        run: |
          set -euo pipefail
          if xcodebuild build \
            -project ClipboardPlus.xcodeproj \
            -scheme ClipboardPlus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData-device \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > device-build.log 2>&1; then
            echo "Device build succeeded."
          else
            grep -E "error:" device-build.log | sort -u | head -40
            exit 1
          fi

      - name: Verify embedded extensions (Device)
        working-directory: app
        run: |
          set -euo pipefail
          app_path="DerivedData-device/Build/Products/Release-iphoneos/ClipboardPlus.app"
          test -d "$app_path/PlugIns/ClipboardPlusKeyboard.appex"
          test -f "$app_path/PlugIns/ClipboardPlusKeyboard.appex/ClipboardPlusKeyboard"
          test -d "$app_path/PlugIns/ClipboardPlusKeyboard.appex/AzooKeyKanaKanjiConverter_KanaKanjiConverterModuleWithDefaultDictionary.bundle/Dictionary"
          test -f "$app_path/PlugIns/ClipboardPlusKeyboard.appex/AzooKeyKanaKanjiConverter_KanaKanjiConverterModuleWithDefaultDictionary.bundle/Dictionary/louds/charID.chid"
          test -d "$app_path/PlugIns/ClipboardPlusShare.appex"
          test -f "$app_path/PlugIns/ClipboardPlusShare.appex/ClipboardPlusShare"

      - name: Run pure logic unit tests on iPad
        working-directory: app
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
          # xcodebuild passes TEST_RUNNER_* to the tests without the prefix.
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/app/build/snapshots
        run: |
          set -euo pipefail
          mkdir -p build build/snapshots
          xcodebuild test \
            -project ClipboardPlus.xcodeproj \
            -scheme ClipboardPlus \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 120 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 180 \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/ClipboardPlusTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Pictures of the main screens with fictional sample data, for design review.
      - name: Collect screen snapshots
        if: always()
        working-directory: app
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -uo pipefail
          mkdir -p build/snapshots
          if [ -z "$(ls -A build/snapshots)" ]; then
            fallback=$(find "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_ID" -type d -name clipboardplus-snapshots 2>/dev/null | head -n 1)
            if [ -n "$fallback" ]; then cp "$fallback"/*.png build/snapshots/ || true; fi
          fi
          ls -la build/snapshots

      - name: Upload screen snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen-snapshots
          path: app/build/snapshots
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ClipboardPlusTests-results
          path: app/build/ClipboardPlusTests.xcresult
          if-no-files-found: ignore
