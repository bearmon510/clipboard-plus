name: ClipboardPlus
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # The real Bundle ID is passed from a GitHub secret at archive time. The Control Center
    # extension derives its ID from this one, so both targets read the same setting.
    APP_BUNDLE_ID: example.clipboardplus
    # The app and its extension must carry the same version.
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClipboardPlus:
    type: application
    platform: iOS
    sources:
      - ClipboardPlus
      - Shared
    dependencies:
      - sdk: libsqlite3.tbd
      - target: ClipboardPlusControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/ClipboardPlus-Info.plist
      properties:
        CFBundleDisplayName: clipboard+
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSScreenCaptureUsageDescription: 選んだ範囲の文字や画像をクリップボードに保存するために、画面の内容を取り込みます。取り込んだ画面は保存せず、外へ送りません。
        NSPhotoLibraryUsageDescription: 撮ったスクリーンショットを見つけて、範囲を選んで切り取るために使います。写真を外へ送ることはありません。
        # Shows the Documents folder (measurement log only) in the Files app.
        # History, images and backups stay outside it.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: example.clipboardplus.backup
            UTTypeDescription: clipboard+ バックアップ
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [clipboardplus]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
  ClipboardPlusControls:
    type: app-extension
    platform: iOS
    # Controls in Control Center need iOS 18. The app itself still runs on iOS 17.
    deploymentTarget: "18.0"
    sources:
      - ClipboardPlusControls
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).controls
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CLIPBOARD_PLUS_CONTROLS
    info:
      path: Generated/ClipboardPlusControls-Info.plist
      properties:
        CFBundleDisplayName: clipboard+
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ClipboardPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClipboardPlusTests
    dependencies:
      - target: ClipboardPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.clipboardplus.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClipboardPlus:
    build:
      targets:
        ClipboardPlus: all
        ClipboardPlusTests: [test]
    test:
      config: Debug
      targets:
        - ClipboardPlusTests

