name: ClipboardPlus
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  ClipboardPlus:
    type: application
    platform: iOS
    sources:
      - ClipboardPlus
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.clipboardplus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Generated/ClipboardPlus-Info.plist
      properties:
        CFBundleDisplayName: clipboard+
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
  ClipboardPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClipboardPlusTests
    dependencies:
      - target: ClipboardPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.clipboardplus.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClipboardPlus:
    build:
      targets:
        ClipboardPlus: all
        ClipboardPlusTests: [test]
    test:
      config: Debug
      targets:
        - ClipboardPlusTests

