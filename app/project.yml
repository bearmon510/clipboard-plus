name: ClipboardPlus
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # The real Bundle ID is passed from a GitHub secret at archive time.
    APP_BUNDLE_ID: example.clipboardplus
    APP_GROUP_ID: group.$(APP_BUNDLE_ID)
    MARKETING_VERSION: "0.15.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClipboardPlus:
    type: application
    platform: iOS
    sources:
      - ClipboardPlus
      - Shared
    dependencies:
      - sdk: libsqlite3.tbd
      - target: ClipboardPlusKeyboard
        embed: true
      - target: ClipboardPlusShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: ClipboardPlus/ClipboardPlus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/ClipboardPlus-Info.plist
      properties:
        CFBundleDisplayName: clipboard+
        ClipboardPlusAppGroup: $(APP_GROUP_ID)
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: 近くのWindowsのPCと、コピーした文章を受け渡すために使います。
        NSCameraUsageDescription: PCに表示されたQRコードを読んで、PCと組にするために使います。
        NSPhotoLibraryUsageDescription: 撮ったスクリーンショットを見つけて、範囲を選んで切り取るために使います。写真を外へ送ることはありません。
        # Shows the Documents folder (measurement log only) in the Files app.
        # History, images and backups stay outside it.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: example.clipboardplus.backup
            UTTypeDescription: clipboard+ バックアップ
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [clipboardplus]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
  ClipboardPlusKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - ClipboardPlusKeyboard
      - path: Shared
        excludes:
          - CaptureIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).keyboard
        CODE_SIGN_ENTITLEMENTS: ClipboardPlusKeyboard/ClipboardPlusKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/ClipboardPlusKeyboard-Info.plist
      properties:
        CFBundleDisplayName: clipboard+
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ClipboardPlusAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: true
  ClipboardPlusShare:
    type: app-extension
    platform: iOS
    sources:
      - ClipboardPlusShare
      - path: Shared
        excludes:
          - CaptureIntents.swift
          - KeyboardHistory.swift
          - KeyboardSettings.swift
          - KeyboardTheme.swift
          - KeyboardViewModel.swift
          - KeyboardView.swift
          - KeyboardAlphanumericView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        CODE_SIGN_ENTITLEMENTS: ClipboardPlusShare/ClipboardPlusShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/ClipboardPlusShare-Info.plist
      properties:
        CFBundleDisplayName: clipboard+
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ClipboardPlusAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
  ClipboardPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClipboardPlusTests
    dependencies:
      - target: ClipboardPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClipboardPlus:
    build:
      targets:
        ClipboardPlus: all
        ClipboardPlusTests: [test]
    test:
      config: Debug
      targets:
        - ClipboardPlusTests

